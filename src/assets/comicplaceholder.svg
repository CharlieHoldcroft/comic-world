<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 180" width="120" height="180">
  <defs>
    <pattern id="halftone" width="6" height="6" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="3" r="1.3" fill="#3d4047" opacity="0.35"/>
    </pattern>
  </defs>

  <!-- Cover -->
  <rect x="1.5" y="1.5" width="117" height="177" rx="3" fill="#f4f5f7" stroke="#1a1a1a" stroke-width="3"/>
  <rect x="6" y="34" width="108" height="122" fill="url(#halftone)"/>

  <!-- Masthead -->
  <rect x="6" y="6" width="108" height="24" fill="#3d4047"/>
  <text x="60" y="24" text-anchor="middle" font-family="Impact, 'Arial Black', sans-serif" font-size="17" fill="#f4f5f7" letter-spacing="1">COMIC</text>

  <!-- Starburst -->
  <polygon fill="#f4f5f7" stroke="#1a1a1a" stroke-width="2.5" stroke-linejoin="round"
    points="60,52 68,72 88,64 79,84 100,92 79,100 88,120 68,112 60,132 52,112 32,120 41,100 20,92 41,84 32,64 52,72"/>
  <text x="60" y="104" text-anchor="middle" font-family="Impact, 'Arial Black', sans-serif" font-size="32" fill="#3d4047">?</text>

  <!-- Issue box + footer -->
  <rect x="6" y="160" width="108" height="14" fill="#1a1a1a"/>
  <text x="60" y="170.5" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" font-weight="700" fill="#f4f5f7" letter-spacing="1.5">NO COVER YET</text>
</svg>
